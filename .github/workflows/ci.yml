name: CI

# Lint, tests and spec checks on every PR. deploy.yml runs the same checks
# again before deploying, so a red main never ships.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Only shipped (non-dev) dependencies gate the build.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The committed openapi.json must match what the code generates, and
      # pass Redocly's recommended rules.
      - name: Spec is up to date
        run: npm run spec:check

      - name: Lint spec
        run: npm run lint:spec

  # Fails a PR that breaks /v1 for existing callers (removed route, field,
  # enum value; narrowed type; new required parameter). A breaking change
  # belongs in /v2.
  breaking-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Base branch spec
        run: |
          git fetch --depth=1 origin "${BASE_REF}"
          git show "origin/${BASE_REF}:openapi.json" > base-openapi.json
        env:
          BASE_REF: ${{ github.base_ref }}

      - uses: oasdiff/oasdiff-action/breaking@14ca7009a63c417dfe27b7c44359c4bcccaf8eee # v0.2.1
        with:
          base: base-openapi.json
          revision: openapi.json
          fail-on: ERR
          review: false
          github-token: ''

  # Fails a PR that adds a dependency with a known high or critical advisory.
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
